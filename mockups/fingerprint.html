<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Fingerprint – Subset and superset mockups</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..700&display=swap" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="mock.css" />
    <style>
      .layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 36px 56px; padding-bottom: 72px; align-items: start; }
      @media (min-width: 901px) { .layout { grid-template-columns: minmax(0, 1fr) 300px; } }

      .strips { display: flex; flex-direction: column; gap: 14px; }
      .strip-row { display: grid; grid-template-columns: 6.2rem minmax(0, 1fr) 4.6rem; align-items: center; gap: 14px; animation: cell 0.6s var(--ease) backwards; animation-delay: calc(var(--i) * 45ms); }
      .strip-row .k { font-weight: var(--w-label); }
      .strip-row .tot { text-align: right; color: var(--muted); }
      .strip { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 3px; }
      .cell { height: 34px; padding: 0; border: 0; border-radius: 3px; background: rgba(255, 255, 255, 0.045); cursor: pointer; transition: transform 0.3s var(--spring), outline-color 0.2s; outline: 2px solid transparent; outline-offset: 1px; }
      .cell.has { background: rgba(88, 196, 221, var(--a)); }
      .cell:hover { transform: scaleY(1.28); outline-color: var(--text); }
      .cell.pinned { outline-color: var(--yellow); transform: scaleY(1.28); }
      .cell:focus-visible { outline-color: var(--yellow); }

      .detail { position: sticky; top: 20px; display: flex; flex-direction: column; gap: 14px; }
      .detail .clock-box { max-width: 260px; }
      .d-name { font-size: 2.6rem; font-weight: var(--w-display); letter-spacing: var(--track); line-height: 1; }
      .d-prime { color: var(--blue); font-size: 1.25rem; letter-spacing: 0.03em; }
      .d-count { font-weight: var(--w-label); }
      .d-list { color: var(--muted); line-height: 1.7; overflow-wrap: anywhere; }
      .d-list b { color: var(--text); font-weight: var(--w-head); }
      .mc-dot.dim { fill: var(--line-strong); }
    </style>
  </head>
  <body>
    <header class="site">
      <div class="bar">
        <a class="logo" href="index.html">Subset and superset mockups</a>
        <nav aria-label="Mockups">
          <a href="constellation.html">Constellation</a>
          <a href="walk.html">Walk</a>
          <a href="rings.html">Rings</a>
          <a href="fingerprint.html" aria-current="page">Fingerprint</a>
          <a href="overlap.html">Overlap</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="wrap page-head rise">
        <h1 class="title">Fingerprint</h1>
        <div class="field"><input id="q" type="text" aria-label="Set" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="0146" value="024579" /></div>
        <div class="seg pair" role="group" aria-label="Direction">
          <button type="button" data-dir="down" aria-pressed="true">Subsets</button>
          <button type="button" data-dir="up" aria-pressed="false">Supersets</button>
        </div>
      </section>

      <section class="wrap layout">
        <div class="strips" id="strips"></div>
        <aside class="detail" aria-live="polite">
          <div class="clock-box" id="d-clock"></div>
          <p class="d-name" id="d-name"></p>
          <p class="d-prime" id="d-prime"></p>
          <p class="d-count" id="d-count"></p>
          <p class="d-list" id="d-list"></p>
        </aside>
      </section>
    </main>

    <script src="../js/forte-table.js"></script>
    <script src="../js/theory.js"></script>
    <script src="lattice.js"></script>
    <script>
      (() => {
        const $ = (id) => document.getElementById(id);
        let dir = 'down';
        let set = [];
        let data = new Map();
        let pinned = null, shown = null, cycle = 0, timer = 0;

        const read = (t) => {
          const out = [];
          for (const ch of t.toUpperCase()) {
            if (ch >= '0' && ch <= '9') out.push(Number(ch));
            else if (ch === 'A') out.push(10);
            else if (ch === 'B') out.push(11);
          }
          return PC.toPcs(out);
        };

        function build() {
          set = read($('q').value);
          pinned = null;
          if (!set.length) { $('strips').innerHTML = ''; return; }
          data = LAT.content(set, dir);
          const n = set.length;
          const cards = dir === 'down' ? [...Array(n - 1).keys()].map((i) => i + 1) : [...Array(12 - n).keys()].map((i) => n + 1 + i);
          const max = Math.max(1, ...[...data.values()].map((a) => a.length));
          $('strips').innerHTML = cards.map((k, i) => {
            const names = LAT.classes.filter((c) => c.prime.length === k).map((c) => c.name);
            const present = names.filter((nm) => data.has(nm)).length;
            const cells = names.map((nm) => {
              const cnt = data.has(nm) ? data.get(nm).length : 0;
              const a = cnt ? (0.28 + 0.72 * Math.log(1 + cnt) / Math.log(1 + max)).toFixed(2) : 0;
              return `<button type="button" class="cell${cnt ? ' has' : ''}" style="--a:${a}" data-name="${nm}" aria-label="${nm}, ${cnt}"></button>`;
            }).join('');
            return `<div class="strip-row" style="--i:${i}"><span class="k">${k} ${k === 1 ? 'note' : 'notes'}</span><div class="strip" style="--n:${names.length}">${cells}</div><span class="tot">${present} of ${names.length}</span></div>`;
          }).join('');
          show(null);
        }

        function show(name) {
          clearInterval(timer);
          shown = name;
          cycle = 0;
          if (!name) {
            const c = PC.forteClass(set);
            $('d-clock').innerHTML = LAT.clock({ on: set });
            $('d-name').textContent = c.name;
            $('d-prime').textContent = LAT.label(set);
            const total = [...data.values()].reduce((a, b) => a + b.length, 0);
            $('d-count').textContent = `${data.size} classes in ${total} ${dir === 'down' ? 'subsets' : 'supersets'}`;
            $('d-list').textContent = '';
            return;
          }
          const occ = data.get(name) || [];
          const c = LAT.byName.get(name);
          $('d-name').textContent = name;
          $('d-prime').textContent = LAT.label(c.prime);
          $('d-count').textContent = occ.length ? `${occ.length} ${occ.length === 1 ? 'time' : 'times'}` : 'Not present';
          const paint = () => {
            if (!occ.length) { $('d-clock').innerHTML = LAT.clock({ on: set }); $('d-list').textContent = ''; return; }
            const cur = occ[cycle % occ.length];
            const spec = dir === 'down' ? { on: cur, ghost: [] } : { on: set, hot: cur.filter((p) => !set.includes(p)) };
            $('d-clock').innerHTML = LAT.clock(spec);
            if (dir === 'down') {
              // the notes of the set that are not in this subset stay visible, dimmed
              const dim = set.filter((p) => !cur.includes(p));
              const svg = $('d-clock').querySelector('svg');
              dim.forEach((p) => {
                const [x, y] = LAT.pos(p, 38);
                svg.insertAdjacentHTML('beforeend', `<circle class="mc-dot ghost" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6"/>`);
              });
            }
            const shownList = occ.slice(0, 10).map((o, i) => (i === cycle % occ.length ? `<b>${LAT.label(o)}</b>` : LAT.label(o)));
            $('d-list').innerHTML = shownList.join('&ensp;') + (occ.length > 10 ? `&ensp;+${occ.length - 10} more` : '');
          };
          paint();
          if (occ.length > 1) timer = setInterval(() => { cycle++; paint(); }, 850);
        }

        $('strips').addEventListener('mouseover', (e) => {
          const b = e.target.closest('[data-name]');
          if (b && !pinned) show(b.dataset.name);
        });
        $('strips').addEventListener('focusin', (e) => {
          const b = e.target.closest('[data-name]');
          if (b && !pinned) show(b.dataset.name);
        });
        $('strips').addEventListener('mouseleave', () => { if (!pinned) show(null); });
        $('strips').addEventListener('click', (e) => {
          const b = e.target.closest('[data-name]');
          if (!b) return;
          document.querySelectorAll('.cell.pinned').forEach((x) => x.classList.remove('pinned'));
          if (pinned === b.dataset.name) { pinned = null; show(null); return; }
          pinned = b.dataset.name;
          b.classList.add('pinned');
          show(pinned);
        });

        $('q').addEventListener('input', (e) => {
          const clean = e.target.value.replace(/[^0-9abAB]/g, '').toUpperCase();
          if (clean !== e.target.value) e.target.value = clean;
          build();
        });
        document.querySelectorAll('[data-dir]').forEach((b) => b.addEventListener('click', () => {
          dir = b.dataset.dir;
          document.querySelectorAll('[data-dir]').forEach((o) => o.setAttribute('aria-pressed', String(o === b)));
          build();
        }));

        build();
      })();
    </script>
  </body>
</html>
